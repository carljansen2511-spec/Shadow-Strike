<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Strike</title>
<style>
:root{
  --bg:#0a0918;
  --fg:#e8f6ff;
  --btn:#37d6e6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:Georgia,serif
}
body{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px
}
canvas{
  width:100%;max-width:960px;height:auto;
  aspect-ratio:16/9;display:block
}
button{
  background:transparent;color:var(--btn);
  border:1.5px solid var(--btn);padding:10px 26px;
  border-radius:999px;font:600 15px Georgia,serif;
  letter-spacing:.12em;cursor:pointer
}
button:active{transform:scale(.96)}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<button id="b">▶ PLAY WITH SOUND</button>
<script>
const c=document.getElementById('c'),
x=c.getContext('2d'),
b=document.getElementById('b'),
W=960,H=540,G=410,OL='#1a1430';

const ease=v=>{
  v=Math.max(0,Math.min(1,v));
  return v*v*(3-2*v);
};
const cl=(v,a=0,m=1)=>Math.max(a,Math.min(m,v));

let seed=7;
const rnd=()=> (seed=seed*16807%2147483647)/2147483647;

const stars=Array.from({length:60},()=>[
  rnd()*W,rnd()*230,rnd()*1.5+.5,rnd()*6
]);
const petals=Array.from({length:26},()=>[
  rnd(),rnd(),rnd(),rnd()
]);
const blood=Array.from({length:60},()=>{
  const a=-Math.PI/2+(rnd()-.5)*2.6,s=180+rnd()*520;
  return{
    vx:Math.cos(a)*s*(rnd()<.5?-1:1)*.8,
    vy:Math.sin(a)*s,r:2+rnd()*4.5
  };
});

const limb=(a,b2,c2,d,w,col)=>{
  x.lineCap='round';
  x.strokeStyle=OL;x.lineWidth=w+4;
  x.beginPath();x.moveTo(a,b2);x.lineTo(c2,d);x.stroke();
  x.strokeStyle=col;x.lineWidth=w;x.stroke();
};
const fo=f=>{
  x.fillStyle=f;x.fill();x.lineWidth=2.5;
  x.strokeStyle=OL;x.stroke();
};
const circ=(a,b2,r,f)=>{
  x.beginPath();x.arc(a,b2,r,0,7);fo(f);
};
const rr=(a,b2,w,h,r,f)=>{
  x.beginPath();x.roundRect(a,b2,w,h,r);fo(f);
};

/* =========================
   BACKGROUND AND ENVIRONMENT
========================= */
function bg(t){
  zm(t);
  let g=x.createLinearGradient(0,0,0,G);
  g.addColorStop(0,'#0c1238');
  g.addColorStop(.55,'#3b2a72');
  g.addColorStop(1,'#f2a27c');
  x.fillStyle=g;x.fillRect(0,0,W,H);

  stars.forEach(s=>{
    x.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+s[3]));
    x.fillStyle='#fff';
    x.fillRect(s[0],s[1],s[2],s[2]);
  });
  x.globalAlpha=1;

  // Moon glow behind the clouds
  x.save();
  const moonX=740, moonY=120, moonR=48;
  x.shadowColor='#bfe9ff';
  x.shadowBlur=65;
  x.fillStyle='rgba(180,205,255,.12)';
  x.beginPath();
  x.arc(moonX,moonY,moonR+9,0,Math.PI*2);
  x.fill();
  x.shadowBlur=0;

  // Gray lunar surface shading
  const moonGrad=x.createRadialGradient(
    moonX-17,moonY-19,3,
    moonX+9,moonY+10,moonR*1.25
  );
  moonGrad.addColorStop(0,'#ffffff');
  moonGrad.addColorStop(.35,'#e3e6ef');
  moonGrad.addColorStop(.72,'#a9b0c5');
  moonGrad.addColorStop(1,'#59627e');
  x.fillStyle=moonGrad;
  x.beginPath();
  x.arc(moonX,moonY,moonR,0,Math.PI*2);
  x.fill();

  // Keep craters inside the moon
  x.save();
  x.beginPath();
  x.arc(moonX,moonY,moonR,0,Math.PI*2);
  x.clip();
  const craters=[
    [-17,-15,9],[-2,-24,5],[17,-9,8],
    [8,9,12],[-19,13,6],[27,24,5],
    [-5,31,5],[27,-28,3]
  ];
  craters.forEach(([dx,dy,r],i)=>{
    const cg=x.createRadialGradient(
      moonX+dx-r*.25,moonY+dy-r*.3,1,
      moonX+dx,moonY+dy,r
    );
    cg.addColorStop(0,'rgba(75,83,111,.05)');
    cg.addColorStop(.65,'rgba(86,94,119,.20)');
    cg.addColorStop(1,'rgba(45,52,76,.48)');
    x.fillStyle=cg;
    x.beginPath();
    x.ellipse(moonX+dx,moonY+dy,r,r*(i%2?.72:1),-.35,0,Math.PI*2);
    x.fill();
    x.strokeStyle='rgba(255,255,255,.24)';
    x.lineWidth=1;
    x.beginPath();
    x.arc(moonX+dx-1,moonY+dy-1,r*.72,Math.PI*1.05,Math.PI*1.8);
    x.stroke();
  });
  x.globalAlpha=.16;
  x.fillStyle='#626b86';
  for(let i=0;i<18;i++){
    const px=moonX-39+(i*29%78);
    const py=moonY-37+(i*43%74);
    x.fillRect(px,py,1.5,1.5);
  }
  x.restore();
  x.strokeStyle='rgba(220,239,255,.7)';
  x.lineWidth=1.5;
  x.beginPath();
  x.arc(moonX,moonY,moonR,Math.PI*1.05,Math.PI*1.85);
  x.stroke();
  x.restore();

  x.fillStyle='#2a2160';
  x.beginPath();x.moveTo(0,G);
  [[0,300],[120,230],[240,290],[380,200],
   [520,285],[660,230],[800,300],[900,240],[960,280]]
   .forEach(p=>x.lineTo(p[0],p[1]));
  x.lineTo(W,G);x.fill();

  const haze=x.createLinearGradient(0,205,0,G);
  haze.addColorStop(0,'rgba(135,139,207,0)');
  haze.addColorStop(.7,'rgba(116,104,169,.12)');
  haze.addColorStop(1,'rgba(28,20,63,.15)');
  x.fillStyle=haze;
  x.fillRect(0,205,W,G-205);

  function pineTree(tx,base,size,color){
    x.save();x.translate(tx,base);x.scale(size,size);
    x.fillStyle=color;x.fillRect(-2,-95,4,95);
    const layers=[
      [0,-112,15],[0,-96,22],[0,-77,29],
      [0,-57,35],[0,-36,42]
    ];
    layers.forEach(([cx,cy,w],i)=>{
      x.beginPath();
      x.moveTo(cx,cy-25);x.lineTo(cx-w,cy+13);
      x.lineTo(cx-w*.45,cy+8);x.lineTo(cx-w*.7,cy+24);
      x.lineTo(cx,cy+15);x.lineTo(cx+w*.7,cy+24);
      x.lineTo(cx+w*.45,cy+8);x.lineTo(cx+w,cy+13);
      x.closePath();x.fill();
    });
    x.strokeStyle='rgba(116,112,174,.22)';x.lineWidth=1.5;
    for(let i=0;i<4;i++){
      x.beginPath();x.moveTo(-12-i*3,-94+i*18);
      x.lineTo(0,-103+i*18);x.lineTo(12+i*3,-94+i*18);x.stroke();
    }
    x.restore();
  }
  [
    [35,G-15,.48,'#211b50'],[260,G-10,.38,'#252054'],
    [390,G-12,.46,'#211b4b'],[620,G-8,.40,'#262052'],
    [960,G-12,.50,'#201a4b']
  ].forEach(p=>pineTree(...p));
  [
    [25,G-5,.78,'#171439'],[320,G-3,.65,'#1b173f'],
    [680,G-4,.72,'#1a153d'],[930,G-4,.85,'#171338']
  ].forEach(p=>pineTree(...p));
  pineTree(-8,G+15,1.12,'#100e29');
  pineTree(970,G+15,1.18,'#100e29');

  x.save();
  x.globalAlpha=.14+.05*Math.sin(t*.8);
  const mist=x.createLinearGradient(0,G-100,0,G+10);
  mist.addColorStop(0,'rgba(193,193,255,0)');
  mist.addColorStop(.65,'#b8b5ed');
  mist.addColorStop(1,'rgba(133,126,190,0)');
  x.fillStyle=mist;x.fillRect(0,G-100,W,110);
  x.restore();

  const pag=(cx,s)=>{
    x.fillStyle='#181236';x.fillRect(cx-50*s,G-40,100*s,40);
    for(let i=0;i<3;i++){
      const y=G-40-i*58*s,w=(110-i*24)*s;
      x.fillRect(cx-w*.35,y,w*.7,58*s);
      x.beginPath();x.moveTo(cx-w,y+4);
      x.lineTo(cx-w*.3,y-18*s);x.lineTo(cx+w*.3,y-18*s);
      x.lineTo(cx+w,y+4);x.lineTo(cx,y+14);x.closePath();x.fill();
    }
  };
  pag(110,1);pag(850,1.1);
  x.fillStyle='#2b2447';x.fillRect(0,G,W,H-G);
  x.strokeStyle='#3d3468';x.lineWidth=2;
  for(let i=1;i<4;i++){
    x.beginPath();x.moveTo(0,G+i*34);x.lineTo(W,G+i*34);x.stroke();
  }
  x.strokeStyle='#120d28';x.lineWidth=3;
  x.beginPath();x.moveTo(0,50);x.quadraticCurveTo(W/2,110,W,50);x.stroke();
  [[160,67],[480,80],[800,67]].forEach((p,i)=>{
    const lx=p[0]+Math.sin(t*2+i)*4,ly=p[1]+22;
    x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(lx,ly-14);x.stroke();
    x.save();x.shadowColor='#ff8a3a';x.shadowBlur=30;
    x.beginPath();x.ellipse(lx,ly,16,20,0,0,7);fo('#e8432b');x.restore();
    rr(lx-8,ly-24,16,6,2,'#d4a93a');
  });
}

/* =========================
   ORDINARY GUY
========================= */
function guy(t){
  if(t>4.5)return;
  const wt=Math.min(t,3.7),
  gx=170+310*cl(wt/3.7)+70*ease((t-4.5)/.7),
  f=ease((t-4.5)/.9),ph=wt*9,hit=t>4.5;
  if(t<3.6){
    x.fillStyle='rgba(255,255,255,.8)';x.font='22px serif';x.textAlign='left';
    x.fillText('♪',gx+24,G-195-((t*40)%25));
  }
  x.save();x.translate(gx,G-12*f);x.rotate(f*1.45);
  const s=Math.sin(ph)*14;
  x.translate(0,hit?0:Math.abs(Math.sin(ph))*-3);
  limb(-4,-72,-4+s,0,12,'#2b3350');
  limb(4,-72,4-s,0,12,'#2b3350');
  rr(-19,-134,38,66,12,'#4a86e0');
  limb(-14,-124,-14-s*.7,-84,9,'#4a86e0');
  limb(14,-124,14+s*.7,-84,9,'#4a86e0');
  circ(-14-s*.7,-80,6,'#ffd9b8');circ(14+s*.7,-80,6,'#ffd9b8');
  rr(-5,-146,10,14,3,'#ffd9b8');circ(0,-156,19,'#ffd9b8');
  x.beginPath();x.arc(0,-159,20.5,Math.PI,0);
  x.lineTo(12,-160);x.lineTo(4,-166);x.lineTo(-4,-160);x.lineTo(-12,-165);
  x.closePath();fo('#6b4527');
  if(!hit){
    circ(-6,-153,2.4,OL);circ(6,-153,2.4,OL);circ(0,-146,2,'#c46b5a');
  }else{
    x.strokeStyle=OL;x.lineWidth=2.5;
    [-6,6].forEach(e=>{
      x.beginPath();x.moveTo(e-3,-156);x.lineTo(e+3,-150);
      x.moveTo(e+3,-156);x.lineTo(e-3,-150);x.stroke();
    });
  }
  x.restore();
}

/* =========================
   NINJA AND KATANA
========================= */
function ninja(t,px,o,al){
  x.save();x.globalAlpha=al;x.translate(px,G+(o.y||0));x.scale(-1,1);x.rotate(o.lean||0);
  const cr=o.cr,w=Math.sin(t*7);
  const sc=()=>{
    x.beginPath();x.moveTo(-6,-146+cr);
    x.bezierCurveTo(-40,-150+cr+w*10,-70,-132+cr-w*14,-110,-146+cr+w*16);
    x.stroke();
  };
  x.lineCap='round';x.strokeStyle=OL;x.lineWidth=14;sc();
  x.strokeStyle='#37d6e6';x.lineWidth=8;sc();
  limb(-6,-70+cr,-22-cr*.6,0,13,'#1f1a3d');
  limb(8,-70+cr,24+cr*.8,0,13,'#1f1a3d');
  rr(-17,-132+cr,34,64,10,'#2a2250');rr(-17,-90+cr,34,9,3,'#37d6e6');

  // Scabbard
  x.save();x.lineCap='round';x.lineJoin='round';
  x.strokeStyle='#090817';x.lineWidth=13;x.beginPath();x.moveTo(-25,-112+cr);x.lineTo(13,-76+cr);x.stroke();
  x.strokeStyle='#17152d';x.lineWidth=9;x.beginPath();x.moveTo(-25,-112+cr);x.lineTo(13,-76+cr);x.stroke();
  x.strokeStyle='#5d567e';x.lineWidth=1.5;x.beginPath();x.moveTo(-26,-112+cr);x.lineTo(11,-77+cr);x.stroke();
  x.strokeStyle='#d4a93a';x.lineWidth=3;x.beginPath();
  x.moveTo(-16,-103+cr);x.lineTo(-11,-108+cr);x.moveTo(6,-83+cr);x.lineTo(11,-88+cr);x.stroke();
  x.save();x.translate(-5,-94+cr);x.rotate(Math.PI/4);rr(-7,-3,14,6,2,'#d4a93a');x.restore();x.restore();

  circ(2,-150+cr,16,'#2a2250');rr(-12,-160+cr,28,7,3,'#c9d6e8');
  x.save();x.shadowColor='#7ff';x.shadowBlur=10;x.fillStyle='#aef6ff';
  x.beginPath();x.ellipse(11,-150+cr,4,2.2,0,0,7);x.fill();x.restore();
  const hx=o.hand[0],hy=o.hand[1]+cr*.4;
  limb(6,-122+cr,hx,hy,9,'#2a2250');
  x.save();x.translate(hx,hy);x.rotate(o.a);
  rr(-14,-4,16,8,2,'#3a2a1a');
  x.save();x.beginPath();x.roundRect(-13,-3.5,13,7,2);x.clip();x.strokeStyle='#d9d2e8';x.lineWidth=1.5;
  for(let i=0;i<5;i++){x.beginPath();x.moveTo(-13+i*3,-4);x.lineTo(-9+i*3,4);x.stroke();}
  x.restore();
  x.save();x.shadowColor='#ffcf68';x.shadowBlur=5;rr(-2,-8,4,16,1,'#d4a93a');x.restore();
  const L=Math.max(0,o.L);
  if(L>.5){
    x.save();x.shadowColor='#7feaff';x.shadowBlur=10;x.beginPath();
    x.moveTo(2,-3.5);x.lineTo(L,-2.5);x.lineTo(L+12,0);x.lineTo(L,3);x.lineTo(2,3.5);
    x.closePath();x.fillStyle='#b9d8ef';x.fill();x.restore();
    x.beginPath();x.moveTo(2,-3.5);x.lineTo(L,-2.5);x.lineTo(L+12,0);x.lineTo(L,3);x.lineTo(2,3.5);
    x.closePath();x.fillStyle='#eaf6ff';x.fill();
    x.strokeStyle='#8fd8ff';x.lineWidth=1.5;x.beginPath();x.moveTo(6,-.5);x.lineTo(L,-.5);x.stroke();
    x.strokeStyle='#fff';x.lineWidth=1;x.beginPath();x.moveTo(8,2);x.lineTo(L+9,.5);x.stroke();
    if(o.glint>0){
      const g=o.glint,tip=L*.92;x.save();x.globalAlpha=g;x.shadowColor='#fff';x.shadowBlur=22;x.fillStyle='#fff';
      x.beginPath();x.moveTo(tip-7,0);x.lineTo(tip,-13*g);x.lineTo(tip+7,0);x.lineTo(tip,13*g);x.closePath();x.fill();x.restore();
    }
  }
  x.restore();x.restore();
}

function nState(t){
  if(t<2)return null;
  const o={cr:0,a:.5,L:0,hand:[14,-70],drawn:false,glint:0,lean:0,y:0};
  let px=800;const al=1;const pp=cl((t-2)/.45);
  o.cr=14*ease((t-2.4)/.3);o.y=-440*(1-pp)*(1-pp);
  if(pp<1)o.lean=-.5*(1-pp);
  if(t>=2.82&&t<3.8){
    const e=ease((t-2.82)/.72);o.L=115*e;
    o.hand=[14+16*e,-70-22*e];o.a=.5-.65*e;o.cr=14*(1-e);o.drawn=e>.12;
    if(t<3){const anticipation=ease((t-2.82)/.18);o.hand[0]-=4*anticipation;o.hand[1]+=3*anticipation;}
  }
  if(t>3.35&&t<3.78)o.glint=Math.sin((t-3.35)/.43*Math.PI);
  if(t>=3.8){const e=ease((t-3.8)/.14);px=800-500*e;o.lean=.28;o.cr=0;}
  if(t>=3.94){px=300;o.lean=0;o.cr=22;o.hand=[34,-80];o.a=.08;o.L=115;o.glint=0;o.drawn=true;}
  if(t>=6){const e=ease((t-6)/.6);o.L=115*(1-e);o.a=.08+.4*e;o.hand=[34-20*e,-80+10*e];o.cr=22*(1-e);o.drawn=o.L>.5;}
  return{px,o,al};
}

/* =========================
   SLASH TRAILS
========================= */
function slash(cx,cy,ang,len,bend,u,col,a,w){
  if(u<=0||a<=0)return;
  x.save();x.translate(cx,cy);x.rotate(ang);x.globalAlpha=a;
  x.shadowColor=col==='#fff'?'#6ff':'#f00';x.shadowBlur=22;x.fillStyle=col;
  const N=28,A=[],B=[];
  for(let i=0;i<=N;i++){
    const s=i/N*u,px=(s-.5)*len,py=-bend*Math.sin(Math.PI*s),
    wd=w*Math.sin(Math.PI*s)*Math.min(1,(u-s)*10+.15);
    A.push([px,py-wd]);B.push([px,py+wd*.25]);
  }
  x.beginPath();A.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
  B.reverse().forEach(p=>x.lineTo(p[0],p[1]));x.closePath();x.fill();x.restore();
}

const zm = t => {
  const focus=ease((t-3.78)/0.08)*(1-ease((t-4.12)/0.12));
  const maxZoom=3.4,z=1+(maxZoom-1)*focus;
  const faceX=t<3.94?800-500*ease((t-3.8)/0.14):300;
  const faceY=t<3.94?260:282;
  const offsetX=focus*(W/2-maxZoom*faceX);
  const offsetY=focus*(H/2-maxZoom*faceY);
  x.translate(offsetX,offsetY);x.scale(z,z);
};

/* =========================
   RAGDOLL PHYSICS
========================= */
let rag=null,lt=0;
function ragdoll(t){
  if(t<4.5){rag=null;return}
  if(!rag){
    lt=4.5;
    const P=(dx,dy,hw,hh,vx,vy,va,k)=>({x:480+dx,y:G+dy,vx,vy,a:0,va,hw,hh,k,th:0});
    rag=[
      P(0,-156,19,19,170,-560,7,'h'),P(0,-117,19,17,220,-420,3.5,'u'),
      P(0,-84,19,16,70,-280,-2.5,'l'),P(-14,-104,5,21,-170,-470,-8,'a'),
      P(14,-104,5,21,340,-500,9,'a'),P(-4,-36,6,36,-100,-320,4,'g'),
      P(4,-36,6,36,130,-340,-5,'g')
    ];
  }
  const dt=Math.min(t-lt,.05)/3;lt=t;
  for(let s=0;s<3;s++)rag.forEach(p=>{
    p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
    const r=Math.abs(Math.cos(p.a))*p.hh+Math.abs(Math.sin(p.a))*p.hw;
    if(p.y+r>G+18){
      p.y=G+18-r;
      if(p.vy>200&&t-p.th>.1){thud();p.th=t}
      p.vy*=-.35;p.vx*=.8;p.va*=.65;
      if(Math.abs(p.vy)<60){p.vy=0;p.vx*=.9;p.va*=.85;}
      const q=p.hh>p.hw?Math.round((p.a-1.5708)/3.1416)*3.1416+1.5708:Math.round(p.a/3.1416)*3.1416;
      p.a+=(q-p.a)*.15;
    }
    if(p.x<30||p.x>W-30){p.vx*=-.5;p.x=cl(p.x,30,W-30);}
  });
  rag.forEach(p=>{
    x.save();x.translate(p.x,p.y);x.rotate(p.a);
    if(p.k==='h'){
      circ(0,0,19,'#ffd9b8');x.beginPath();x.arc(0,-3,20.5,Math.PI,0);
      x.lineTo(10,-4);x.lineTo(0,-10);x.lineTo(-10,-4);x.closePath();fo('#6b4527');
      x.strokeStyle=OL;x.lineWidth=2.5;
      [-6,6].forEach(e=>{x.beginPath();x.moveTo(e-3,0);x.lineTo(e+3,6);x.moveTo(e+3,0);x.lineTo(e-3,6);x.stroke();});
    }else if(p.k==='u'){rr(-19,-17,38,34,6,'#4a86e0');x.fillStyle='#c1121f';x.fillRect(-19,12,38,5);}
    else if(p.k==='l'){rr(-19,-16,38,32,6,'#4a86e0');x.fillStyle='#2b3350';x.fillRect(-19,4,38,12);x.fillStyle='#c1121f';x.fillRect(-19,-16,38,5);}
    else if(p.k==='a'){limb(0,-18,0,18,9,'#4a86e0');circ(0,19,6,'#ffd9b8');circ(0,-19,4.5,'#c1121f');}

function frame(t){
  x.clearRect(0,0,W,H);let sx=0,sy=0;
  if(t>2.45&&t<2.7){const k=1-(t-2.45)/.25;sx=Math.sin(t*140)*7*k;sy=Math.cos(t*120)*9*k;}
  if(t>4.5&&t<4.95){const k=1-(t-4.5)/.45;sx=Math.sin(t*120)*12*k;sy=Math.cos(t*100)*8*k;}
  x.save();x.translate(sx,sy);bg(t);
  const pl=ease((t-4.7)/1.5);
  if(pl>0){x.fillStyle='#8d0f1b';x.beginPath();x.ellipse(560,G+10,80*pl,14*pl,0,0,7);x.fill();}
  guy(t);ragdoll(t);const st=nState(t);
  if(t>2.45&&t<2.95){
    const k=(t-2.45)/.5;x.fillStyle='rgba(230,220,255,'+(.5*(1-k))+')';

  if(st){
    if(t>=3.8&&t<4.1){
      const p=ease((t-3.8)/.14),cx=800-500*p,gr=x.createLinearGradient(800,0,cx,0);

      for(let i=1;i<4;i++)ninja(t,Math.min(800,cx+i*40),st.o,.25/i);
    }
    ninja(t,st.px,st.o,st.al);
  }
  if(t>4.5){
    const dt=t-4.5;
    blood.forEach(p=>{
      const y0=G-105,gy=G+p.r*2.2,d=(-p.vy+Math.sqrt(p.vy*p.vy+2*900*(gy-y0)))/900;
      const px=480+p.vx*Math.min(dt,d);let py=y0+p.vy*dt+450*dt*dt;
      x.fillStyle='#c1121f';x.beginPath();

  });
  x.restore();
  const d=t<3.5?0:t<3.78?ease((t-3.5)/.25)*.55:t<4.5?.4:Math.max(0,.4*(1-(t-4.5)/.3));
  if(d>0){x.fillStyle='rgba(5,5,25,'+d+')';x.fillRect(0,0,W,H);}

  if(t>6.8){
    const a=ease((t-6.8)/.9);x.globalAlpha=a*.55;x.fillStyle='#050314';x.fillRect(0,0,W,H);
    x.globalAlpha=a;x.save();x.shadowColor='#37d6e6';x.shadowBlur=30;x.fillStyle='#fff';x.font='bold 64px Georgia,serif';x.fillText('SHADOW STRIKE',W/2,H/2-6);x.restore();

}

/* =========================

========================= */
let AC=null,mg=null,NB=null;

// Your real sword sound. Put slash-sword.mp3 beside this HTML file.
const slashAudio=new Audio('./slash-sword.mp3');
slashAudio.preload='auto';
slashAudio.volume=0.9;

function playSlashAudio(){
  // Clone so the three fast slashes can overlap without cutting each other off.
  const sound=slashAudio.cloneNode();
  sound.volume=0.9;
  sound.currentTime=0;
  const result=sound.play();
  if(result&&typeof result.catch==='function'){
    result.catch(err=>console.warn('Slash sound could not play:',err));
  }
  sound.addEventListener('ended',()=>sound.remove(),{once:true});
}

function initAudio(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  mg=AC.createGain();mg.gain.value=.8;mg.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=NB.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function nz(dur,f1,f2,type,vol,w=0){
  if(!AC)return;
  const T=AC.currentTime+w,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;s.loop=true;f.type=type;f.frequency.setValueAtTime(f1,T);f.frequency.exponentialRampToValueAtTime(f2,T+dur);
  g.gain.setValueAtTime(vol,T);g.gain.exponentialRampToValueAtTime(.001,T+dur);
  s.connect(f);f.connect(g);g.connect(mg);s.start(T);s.stop(T+dur+.05);
}
function tn(f1,f2,dur,type,vol,w=0){
  if(!AC)return;
  const T=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,T);o.frequency.exponentialRampToValueAtTime(f2,T+dur);
  g.gain.setValueAtTime(vol,T);g.gain.exponentialRampToValueAtTime(.001,T+dur);
  o.connect(g);g.connect(mg);o.start(T);o.stop(T+dur+.05);
}

/* =========================
   PLAYBACK AND REPLAY
========================= */
let t0=0,fi=0,playing=false;
function start(){
  initAudio();
  if(AC.state==='suspended')AC.resume();
  // Prime the audio element from the user's button tap to satisfy mobile autoplay rules.
  slashAudio.load();
  t0=performance.now();fi=0;playing=true;b.textContent='↻ REPLAY';
}
function loop(n){
  let t=0;
  if(playing){
    t=(n-t0)/1000;
    if(t>13){t0=n;t=0;fi=0;}
    while(fi<EV.length&&EV[fi][0]<=t){
      if(t-EV[fi][0]<.4)EV[fi][1]();
      fi++;
    }
  }
  frame(t);
  if(!playing){
    x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,W,H);
    x.fillStyle='#fff';x.font='bold 28px Georgia,serif';x.textAlign='center';
    x.fillText('Tap PLAY (sound on)',W/2,H/2);
  }
  requestAnimationFrame(loop);
}
b.onclick=start;
requestAnimationFrame(loop);
