
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Strike</title>

<style>
:root{
  --bg:#0a0918;
  --fg:#e8f6ff;
  --btn:#37d6e6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);

body{
  display:flex;flex-direction:column;align-items:center;

canvas{

<body>
<canvas id="c" width="960" height="540"></canvas>
<button id="b">▶ PLAY WITH SOUND</button>

<script>
const c=document.getElementById('c'),
x=c.getContext('2d'),
b=document.getElementById('b'),
W=960,H=540,G=410,OL='#1a1430';

const ease=v=>{
  v=Math.max(0,Math.min(1,v));
  return v*v*(3-2*v);
};
const cl=(v,a=0,m=1)=>Math.max(a,Math.min(m,v));

let seed=7;
const rnd=()=> (seed=seed*16807%2147483647)/2147483647;

const stars=Array.from({length:60},()=>[
  rnd()*W,rnd()*230,rnd()*1.5+.5,rnd()*6
]);
const petals=Array.from({length:26},()=>[
  rnd(),rnd(),rnd(),rnd()
]);
const blood=Array.from({length:60},()=>{
  const a=-Math.PI/2+(rnd()-.5)*2.6,s=180+rnd()*520;
  return{
    vx:Math.cos(a)*s*(rnd()<.5?-1:1)*.8,
    vy:Math.sin(a)*s,r:2+rnd()*4.5
  };
});

const limb=(a,b2,c2,d,w,col)=>{
  x.lineCap='round';
  x.strokeStyle=OL;x.lineWidth=w+4;
  x.beginPath();x.moveTo(a,b2);x.lineTo(c2,d);x.stroke();
  x.strokeStyle=col;x.lineWidth=w;x.stroke();
};
const fo=f=>{
  x.fillStyle=f;x.fill();x.lineWidth=2.5;
  x.strokeStyle=OL;x.stroke();
};
const circ=(a,b2,r,f)=>{
  x.beginPath();x.arc(a,b2,r,0,7);fo(f);
};
const rr=(a,b2,w,h,r,f)=>{
  x.beginPath();x.roundRect(a,b2,w,h,r);fo(f);
};

/* =========================
   BACKGROUND AND ENVIRONMENT
========================= */
function bg(t){
  zm(t);
  let g=x.createLinearGradient(0,0,0,G);
  g.addColorStop(0,'#0c1238');
  g.addColorStop(.55,'#3b2a72');
  g.addColorStop(1,'#f2a27c');
  x.fillStyle=g;x.fillRect(0,0,W,H);

  stars.forEach(s=>{
    x.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+s[3]));
    x.fillStyle='#fff';
    x.fillRect(s[0],s[1],s[2],s[2]);
  });
  x.globalAlpha=1;

  x.save();
  x.shadowColor='#bfe9ff';x.shadowBlur=60;
  x.fillStyle='#f4fbff';x.beginPath();
  x.arc(740,120,48,0,7);x.fill();
  x.restore();

  x.fillStyle='#2a2160';
  x.beginPath();x.moveTo(0,G);
  [[0,300],[120,230],[240,290],[380,200],
   [520,285],[660,230],[800,300],[900,240],[960,280]]
   .forEach(p=>x.lineTo(p[0],p[1]));
  x.lineTo(W,G);x.fill();

  const pag=(cx,s)=>{
    x.fillStyle='#181236';
    x.fillRect(cx-50*s,G-40,100*s,40);
    for(let i=0;i<3;i++){
      const y=G-40-i*58*s,w=(110-i*24)*s;
      x.fillRect(cx-w*.35,y,w*.7,58*s);
      x.beginPath();
      x.moveTo(cx-w,y+4);
      x.lineTo(cx-w*.3,y-18*s);
      x.lineTo(cx+w*.3,y-18*s);
      x.lineTo(cx+w,y+4);
      x.lineTo(cx,y+14);
      x.closePath();x.fill();
    }
  };
  pag(110,1);pag(850,1.1);

  x.fillStyle='#2b2447';x.fillRect(0,G,W,H-G);
  x.strokeStyle='#3d3468';x.lineWidth=2;
  for(let i=1;i<4;i++){
    x.beginPath();x.moveTo(0,G+i*34);
    x.lineTo(W,G+i*34);x.stroke();
  }

  x.strokeStyle='#120d28';x.lineWidth=3;
  x.beginPath();x.moveTo(0,50);
  x.quadraticCurveTo(W/2,110,W,50);x.stroke();

  [[160,67],[480,80],[800,67]].forEach((p,i)=>{
    const lx=p[0]+Math.sin(t*2+i)*4,ly=p[1]+22;
    x.beginPath();x.moveTo(p[0],p[1]);
    x.lineTo(lx,ly-14);x.stroke();

    x.save();x.shadowColor='#ff8a3a';x.shadowBlur=30;
    x.beginPath();x.ellipse(lx,ly,16,20,0,0,7);
    fo('#e8432b');x.restore();
    rr(lx-8,ly-24,16,6,2,'#d4a93a');
  });
}

/* =========================
   ORDINARY GUY
========================= */
function guy(t){
  if(t>4.5)return;

  const wt=Math.min(t,3.7),
  gx=170+310*cl(wt/3.7)+70*ease((t-4.5)/.7),
  f=ease((t-4.5)/.9),ph=wt*9,hit=t>4.5;

  if(t<3.6){
    x.fillStyle='rgba(255,255,255,.8)';
    x.font='22px serif';x.textAlign='left';
    x.fillText('♪',gx+24,G-195-((t*40)%25));
  }

  x.save();x.translate(gx,G-12*f);x.rotate(f*1.45);
  const s=Math.sin(ph)*14;
  x.translate(0,hit?0:Math.abs(Math.sin(ph))*-3);

  limb(-4,-72,-4+s,0,12,'#2b3350');
  limb(4,-72,4-s,0,12,'#2b3350');
  rr(-19,-134,38,66,12,'#4a86e0');
  limb(-14,-124,-14-s*.7,-84,9,'#4a86e0');
  limb(14,-124,14+s*.7,-84,9,'#4a86e0');
  circ(-14-s*.7,-80,6,'#ffd9b8');
  circ(14+s*.7,-80,6,'#ffd9b8');
  rr(-5,-146,10,14,3,'#ffd9b8');
  circ(0,-156,19,'#ffd9b8');

  x.beginPath();x.arc(0,-159,20.5,Math.PI,0);
  x.lineTo(12,-160);x.lineTo(4,-166);
  x.lineTo(-4,-160);x.lineTo(-12,-165);
  x.closePath();fo('#6b4527');

  if(!hit){
    circ(-6,-153,2.4,OL);circ(6,-153,2.4,OL);
    circ(0,-146,2,'#c46b5a');
  }else{
    x.strokeStyle=OL;x.lineWidth=2.5;
    [-6,6].forEach(e=>{
      x.beginPath();
      x.moveTo(e-3,-156);x.lineTo(e+3,-150);
      x.moveTo(e+3,-156);x.lineTo(e-3,-150);
      x.stroke();
    });
  }
  x.restore();
}

/* =========================
   NINJA AND KATANA
========================= */
function ninja(t,px,o,al){
  x.save();
  x.globalAlpha=al;
  x.translate(px,G+(o.y||0));
  x.scale(-1,1);
  x.rotate(o.lean||0);

  const cr=o.cr,w=Math.sin(t*7);

  const sc=()=>{
    x.beginPath();x.moveTo(-6,-146+cr);
    x.bezierCurveTo(
      -40,-150+cr+w*10,
      -70,-132+cr-w*14,
      -110,-146+cr+w*16
    );
    x.stroke();
  };

  x.lineCap='round';
  x.strokeStyle=OL;x.lineWidth=14;sc();
  x.strokeStyle='#37d6e6';x.lineWidth=8;sc();

  limb(-6,-70+cr,-22-cr*.6,0,13,'#1f1a3d');
  limb(8,-70+cr,24+cr*.8,0,13,'#1f1a3d');

  // Body and belt
  rr(-17,-132+cr,34,64,10,'#2a2250');
  rr(-17,-90+cr,34,9,3,'#37d6e6');

  /*
    SCABBARD:
    Always visible at the hip, including before the blade is drawn.
  */
  x.save();
  x.lineCap='round';
  x.lineJoin='round';

  // Dark outer silhouette
  x.strokeStyle='#090817';
  x.lineWidth=13;
  x.beginPath();
  x.moveTo(-25,-112+cr);
  x.lineTo(13,-76+cr);
  x.stroke();

  // Lacquered scabbard
  x.strokeStyle='#17152d';
  x.lineWidth=9;
  x.beginPath();
  x.moveTo(-25,-112+cr);
  x.lineTo(13,-76+cr);
  x.stroke();

  // Reflected light along the scabbard
  x.strokeStyle='#5d567e';
  x.lineWidth=1.5;
  x.beginPath();
  x.moveTo(-26,-112+cr);
  x.lineTo(11,-77+cr);
  x.stroke();

  // Gold scabbard fittings
  x.strokeStyle='#d4a93a';
  x.lineWidth=3;
  x.beginPath();
  x.moveTo(-16,-103+cr);
  x.lineTo(-11,-108+cr);
  x.moveTo(6,-83+cr);
  x.lineTo(11,-88+cr);
  x.stroke();

  // Belt attachment
  x.save();
  x.translate(-5,-94+cr);
  x.rotate(Math.PI/4);
  rr(-7,-3,14,6,2,'#d4a93a');
  x.restore();
  x.restore();

  // Head and face
  circ(2,-150+cr,16,'#2a2250');
  rr(-12,-160+cr,28,7,3,'#c9d6e8');

  x.save();
  x.shadowColor='#7ff';x.shadowBlur=10;
  x.fillStyle='#aef6ff';
  x.beginPath();
  x.ellipse(11,-150+cr,4,2.2,0,0,7);
  x.fill();
  x.restore();

  // Arm follows the sword grip
  const hx=o.hand[0],hy=o.hand[1]+cr*.4;
  limb(6,-122+cr,hx,hy,9,'#2a2250');

  x.save();
  x.translate(hx,hy);
  x.rotate(o.a);

  // Handle core
  rr(-14,-4,16,8,2,'#3a2a1a');

  // Handle wrapping
  x.save();
  x.beginPath();
  x.roundRect(-13,-3.5,13,7,2);
  x.clip();
  x.strokeStyle='#d9d2e8';
  x.lineWidth=1.5;

  for(let i=0;i<5;i++){
    x.beginPath();
    x.moveTo(-13+i*3,-4);
    x.lineTo(-9+i*3,4);
    x.stroke();
  }
  x.restore();

  // Gold handguard
  x.save();
  x.shadowColor='#ffcf68';
  x.shadowBlur=5;
  rr(-2,-8,4,16,1,'#d4a93a');
  x.restore();

  // Blade smoothly emerges from the hilt
  const L=Math.max(0,o.L);

  if(L>.5){
    // Blade shadow
    x.save();
    x.shadowColor='#7feaff';
    x.shadowBlur=10;
    x.beginPath();
    x.moveTo(2,-3.5);
    x.lineTo(L,-2.5);
    x.lineTo(L+12,0);
    x.lineTo(L,3);
    x.lineTo(2,3.5);
    x.closePath();
    x.fillStyle='#b9d8ef';
    x.fill();
    x.restore();

    // Main steel blade
    x.beginPath();
    x.moveTo(2,-3.5);
    x.lineTo(L,-2.5);
    x.lineTo(L+12,0);
    x.lineTo(L,3);
    x.lineTo(2,3.5);
    x.closePath();
    x.fillStyle='#eaf6ff';
    x.fill();

    // Blade ridge
    x.strokeStyle='#8fd8ff';
    x.lineWidth=1.5;
    x.beginPath();
    x.moveTo(6,-.5);
    x.lineTo(L,-.5);
    x.stroke();

    // Bright cutting edge
    x.strokeStyle='#fff';
    x.lineWidth=1;
    x.beginPath();
    x.moveTo(8,2);
    x.lineTo(L+9,.5);
    x.stroke();

    // Glint at the tip
    if(o.glint>0){
      const g=o.glint,tip=L*.92;

      x.save();
      x.globalAlpha=g;
      x.shadowColor='#fff';
      x.shadowBlur=22;
      x.fillStyle='#fff';

      x.beginPath();
      x.moveTo(tip-7,0);
      x.lineTo(tip,-13*g);
      x.lineTo(tip+7,0);
      x.lineTo(tip,13*g);
      x.closePath();
      x.fill();

      x.restore();
    }
  }

  x.restore();
  x.restore();
}

function nState(t){
  if(t<2)return null;

  const o={
    cr:0,a:.5,L:0,
    hand:[14,-70],
    drawn:false,glint:0,
    lean:0,y:0
  };

  let px=800;
  const al=1;
  const pp=cl((t-2)/.45);

  // Ninja drops into the scene
  o.cr=14*ease((t-2.4)/.3);
  o.y=-440*(1-pp)*(1-pp);

  if(pp<1)o.lean=-.5*(1-pp);

  /*
    UNSHEATHING:
    Starts before the attack dash.
    The blade length, wrist angle and hand position change together.
  */
  if(t>=2.82&&t<3.8){
    const e=ease((t-2.82)/.72);

    o.L=115*e;
    o.hand=[
      14+16*e,
      -70-22*e
    ];
    o.a=.5-.65*e;
    o.cr=14*(1-e);
    o.drawn=e>.12;

    // Small preparatory movement before the blade clears the sheath
    if(t<3){
      const anticipation=ease((t-2.82)/.18);
      o.hand[0]-=4*anticipation;
      o.hand[1]+=3*anticipation;
    }
  }

  // Steel glint after the blade clears the sheath
  if(t>3.35&&t<3.78){
    o.glint=Math.sin((t-3.35)/.43*Math.PI);
  }

  // High-speed dash
  if(t>=3.8){
    const e=ease((t-3.8)/.14);
    px=800-500*e;
    o.lean=.28;
    o.cr=0;
  }

  // Strike pose
  if(t>=3.94){
    px=300;
    o.lean=0;
    o.cr=22;
    o.hand=[34,-80];
    o.a=.08;
    o.L=115;
    o.glint=0;
    o.drawn=true;
  }

  // Blade returns toward the scabbard after the attack
  if(t>=6){
    const e=ease((t-6)/.6);

    o.L=115*(1-e);
    o.a=.08+.4*e;
    o.hand=[
      34-20*e,
      -80+10*e
    ];
    o.cr=22*(1-e);
    o.drawn=o.L>.5;
  }

  return{px,o,al};
}

/* =========================
   SLASH TRAILS
========================= */
function slash(cx,cy,ang,len,bend,u,col,a,w){
  if(u<=0||a<=0)return;
  x.save();x.translate(cx,cy);x.rotate(ang);
  x.globalAlpha=a;
  x.shadowColor=col==='#fff'?'#6ff':'#f00';
  x.shadowBlur=22;x.fillStyle=col;

  const N=28,A=[],B=[];
  for(let i=0;i<=N;i++){
    const s=i/N*u,px=(s-.5)*len,
    py=-bend*Math.sin(Math.PI*s),
    wd=w*Math.sin(Math.PI*s)*Math.min(1,(u-s)*10+.15);
    A.push([px,py-wd]);
    B.push([px,py+wd*.25]);
  }

  x.beginPath();
  A.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
  B.reverse().forEach(p=>x.lineTo(p[0],p[1]));
  x.closePath();x.fill();
  x.restore();
}

const zm=t=>{
  const z=1+.12*ease((t-3.5)/.3)*(1-ease((t-4.6)/.5));
  x.translate(480,G-100);
  x.scale(z,z);
  x.translate(-480,-(G-100));
};

/* =========================
   RAGDOLL PHYSICS
========================= */
let rag=null,lt=0;

function ragdoll(t){
  if(t<4.5){rag=null;return}

  if(!rag){
    lt=4.5;
    const P=(dx,dy,hw,hh,vx,vy,va,k)=>({
      x:480+dx,y:G+dy,vx,vy,a:0,va,hw,hh,k,th:0
    });

    rag=[
      P(0,-156,19,19,170,-560,7,'h'),
      P(0,-117,19,17,220,-420,3.5,'u'),
      P(0,-84,19,16,70,-280,-2.5,'l'),
      P(-14,-104,5,21,-170,-470,-8,'a'),
      P(14,-104,5,21,340,-500,9,'a'),
      P(-4,-36,6,36,-100,-320,4,'g'),
      P(4,-36,6,36,130,-340,-5,'g')
    ];
  }

  const dt=Math.min(t-lt,.05)/3;
  lt=t;

  for(let s=0;s<3;s++)rag.forEach(p=>{
    p.vy+=1500*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.a+=p.va*dt;

    const r=Math.abs(Math.cos(p.a))*p.hh+
            Math.abs(Math.sin(p.a))*p.hw;

    if(p.y+r>G+18){
      p.y=G+18-r;
      if(p.vy>200&&t-p.th>.1){thud();p.th=t}
      p.vy*=-.35;p.vx*=.8;p.va*=.65;

      if(Math.abs(p.vy)<60){
        p.vy=0;p.vx*=.9;p.va*=.85;
      }

      const q=p.hh>p.hw
        ?Math.round((p.a-1.5708)/3.1416)*3.1416+1.5708
        :Math.round(p.a/3.1416)*3.1416;
      p.a+=(q-p.a)*.15;
    }

    if(p.x<30||p.x>W-30){
      p.vx*=-.5;p.x=cl(p.x,30,W-30);
    }
  });

  rag.forEach(p=>{
    x.save();
    x.translate(p.x,p.y);
    x.rotate(p.a);

    if(p.k==='h'){
      circ(0,0,19,'#ffd9b8');
      x.beginPath();
      x.arc(0,-3,20.5,Math.PI,0);
      x.lineTo(10,-4);x.lineTo(0,-10);x.lineTo(-10,-4);
      x.closePath();fo('#6b4527');

      x.strokeStyle=OL;x.lineWidth=2.5;
      [-6,6].forEach(e=>{
        x.beginPath();
        x.moveTo(e-3,0);x.lineTo(e+3,6);
        x.moveTo(e+3,0);x.lineTo(e-3,6);
        x.stroke();
      });
    }else if(p.k==='u'){
      rr(-19,-17,38,34,6,'#4a86e0');
      x.fillStyle='#c1121f';x.fillRect(-19,12,38,5);
    }else if(p.k==='l'){
      rr(-19,-16,38,32,6,'#4a86e0');
      x.fillStyle='#2b3350';x.fillRect(-19,4,38,12);
      x.fillStyle='#c1121f';x.fillRect(-19,-16,38,5);
    }else if(p.k==='a'){
      limb(0,-18,0,18,9,'#4a86e0');
      circ(0,19,6,'#ffd9b8');
      circ(0,-19,4.5,'#c1121f');
    }else{
      limb(0,-30,0,30,12,'#2b3350');
      rr(-8,28,16,8,3,OL);
      circ(0,-31,6,'#c1121f');
    }

    x.restore();
  });
}

const SL=[
  [-.62,400,30,4.00],
  [.55,380,-26,4.13],
  [-.06,440,20,4.26]
];

/* ==============================================
   MANGA IMPACT ILLUSTRATION
============================================== */
function impactFrame(t){
  const start=3.86,end=4.00;
  if(t<start||t>=end)return;

  const p=(t-start)/(end-start);
  const hit=Math.sin(Math.PI*p);
  const W2=c.width,H2=c.height;

  x.save();
  x.globalAlpha=1;

  x.fillStyle='#f4f0e8';
  x.fillRect(0,0,W2,H2);

  x.fillStyle='#08060d';
  x.beginPath();
  x.moveTo(0,0);x.lineTo(960,0);
  x.lineTo(780,105);x.lineTo(960,170);
  x.lineTo(960,540);x.lineTo(0,540);
  x.lineTo(135,390);x.lineTo(0,305);
  x.closePath();x.fill();

  // Radial speed lines
  x.save();
  x.translate(485,265);
  x.rotate(-.18);

  for(let i=0;i<86;i++){
    const a=i*Math.PI*2/86;
    const r0=48+(i%6)*13;
    const r1=260+(i%9)*30;

    x.beginPath();
    x.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);
    x.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);

    x.strokeStyle=i%5===0?'#f31b51':
                  i%3===0?'#853bff':'#f7f1ff';
    x.globalAlpha=.38+hit*.62;
    x.lineWidth=i%6===0?4:1.5;
    x.stroke();
  }
  x.restore();

  // Crimson and violet energy ribbons
  x.save();
  x.lineJoin='miter';
  x.shadowColor='#ed174c';
  x.shadowBlur=18;

  for(let j=0;j<4;j++){
    const off=j*13;
    x.beginPath();
    x.moveTo(45,395+off);
    x.lineTo(250,285+off);
    x.lineTo(215,270+off);
    x.lineTo(445,205+off);
    x.lineTo(385,194+off);
    x.lineTo(695,83+off);
    x.lineTo(565,188+off);
    x.lineTo(625,195+off);
    x.lineTo(350,326+off);
    x.lineTo(390,331+off);
    x.closePath();
    x.fillStyle=j%2?'#7d20da':'#e90d49';
    x.fill();
  }
  x.restore();

  // Ink splashes
  x.save();
  for(let i=0;i<24;i++){
    const a=i*Math.PI*2/24;
    const r=85+(i%5)*21;
    const px=475+Math.cos(a)*r;
    const py=265+Math.sin(a)*r;

    x.fillStyle=i%3===0?'#ed174c':'#f4f0e8';
    x.beginPath();
    x.moveTo(px,py);
    x.lineTo(px+Math.cos(a+.5)*(15+i%4*6),py+Math.sin(a+.5)*22);
    x.lineTo(px+Math.cos(a-.6)*7,py+Math.sin(a-.6)*7);
    x.closePath();x.fill();
  }
  x.restore();

  // Ninja silhouette
  x.save();
  x.translate(485,270);
  x.rotate(-.27);
  x.fillStyle='#030208';

  x.beginPath();
  x.ellipse(25,-91,28,34,-.25,0,Math.PI*2);

  x.beginPath();
  x.moveTo(0,-91);x.lineTo(51,-87);
  x.lineTo(36,-71);x.lineTo(7,-72);
  x.closePath();x.fill();

  // Streaming headband
  x.beginPath();
  x.moveTo(5,-118);
  x.lineTo(-80,-154);
  x.lineTo(-43,-116);
  x.lineTo(-102,-93);
  x.lineTo(-10,-99);
  x.closePath();x.fill();

  // Torso
  x.beginPath();
  x.moveTo(8,-58);x.lineTo(45,-62);
  x.lineTo(76,8);x.lineTo(30,35);
  x.lineTo(-22,1);x.closePath();x.fill();

  // Arms
  x.lineCap='round';x.lineJoin='round';
  x.lineWidth=22;x.strokeStyle='#030208';
  x.beginPath();
  x.moveTo(7,-43);x.lineTo(-27,-12);
  x.lineTo(-68,-32);
  x.moveTo(43,-43);x.lineTo(74,-69);
  x.lineTo(110,-97);
  x.stroke();

  // Legs
  x.lineWidth=24;
  x.beginPath();
  x.moveTo(20,24);x.lineTo(-13,70);x.lineTo(-78,91);
  x.moveTo(40,22);x.lineTo(82,48);x.lineTo(139,37);
  x.stroke();

  // Glowing eye
  x.shadowColor='#ff174f';x.shadowBlur=18;
  x.fillStyle='#ff174f';
  x.beginPath();
  x.moveTo(34,-97);x.lineTo(54,-93);x.lineTo(37,-88);
  x.closePath();x.fill();
  x.restore();

  // Foreground katana
  x.save();
  x.translate(475,270);
  x.rotate(-.49);

  x.shadowColor='#8c35ff';x.shadowBlur=28;
  x.fillStyle='#6425b9';
  x.beginPath();
  x.moveTo(-300,0);
  x.lineTo(212,-14);
  x.quadraticCurveTo(253,-11,300,0);
  x.quadraticCurveTo(252,11,210,10);
  x.lineTo(-300,5);
  x.closePath();x.fill();

  // Steel blade
  x.shadowBlur=0;
  x.fillStyle='#e8f7ff';
  x.beginPath();
  x.moveTo(-292,-5);
  x.lineTo(205,-10);
  x.quadraticCurveTo(254,-8,298,0);
  x.quadraticCurveTo(247,7,205,6);
  x.lineTo(-292,5);
  x.closePath();x.fill();

  // Steel ridge and edge
  x.strokeStyle='#65eaff';x.lineWidth=2;
  x.beginPath();
  x.moveTo(-275,-1);x.lineTo(282,0);x.stroke();

  x.strokeStyle='#fff';x.lineWidth=1;
  x.beginPath();
  x.moveTo(-260,3);x.lineTo(215,6);x.stroke();

  // Wrapped handle
  x.fillStyle='#160e22';
  x.fillRect(-365,-11,70,22);

  for(let i=0;i<6;i++){

  // Impact starburst
  x.save();
  x.translate(510,248);
  x.rotate(.14);
  x.globalAlpha=.55+hit*.45;
  x.fillStyle='#fff';

  x.beginPath();
  for(let i=0;i<32;i++){
    const a=i*Math.PI/16;
    const r=i%2===0?48+hit*30:(i%4===1?18:10);
    if(i===0)x.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    else x.lineTo(Math.cos(a)*r,Math.sin(a)*r);

  x.closePath();x.fill();
  x.restore();

  // Extra ink cuts
  x.globalAlpha=1;
  x.strokeStyle='#fff';x.lineWidth=4;

  x.font='bold 16px monospace';
  x.fillStyle='#9ef4ff';
  x.fillText('SHADOW / BREAK',0,28);
  x.restore();

  // Panel borders
  x.fillStyle='#000';
  x.fillRect(0,0,W2,19);
  x.fillRect(0,H2-19,W2,19);

  // White strobe
  x.globalAlpha=.08+hit*.24;
  x.fillStyle='#fff';
  x.fillRect(0,0,W2,H2);

  x.restore();
}

/* =========================
   MAIN ANIMATION
========================= */
function frame(t){
  x.clearRect(0,0,W,H);

  let sx=0,sy=0;

  if(t>2.45&&t<2.7){
    const k=1-(t-2.45)/.25;
    sx=Math.sin(t*140)*7*k;
    sy=Math.cos(t*120)*9*k;
  }

  if(t>4.5&&t<4.95){
    const k=1-(t-4.5)/.45;
    sx=Math.sin(t*120)*12*k;
    sy=Math.cos(t*100)*8*k;
  }

  x.save();
  x.translate(sx,sy);
  bg(t);

  const pl=ease((t-4.7)/1.5);
  if(pl>0){
    x.fillStyle='#8d0f1b';
    x.beginPath();
    x.ellipse(560,G+10,80*pl,14*pl,0,0,7);
    x.fill();
  }

  guy(t);
  ragdoll(t);
  const st=nState(t);

  if(t>2.45&&t<2.95){
    const k=(t-2.45)/.5;
    x.fillStyle='rgba(230,220,255,'+(.5*(1-k))+')';
    x.beginPath();
    x.ellipse(800,G+6,30+110*k,6+16*k,0,0,7);
    x.fill();
  }

  if(st){
    if(t>=3.8&&t<4.1){
      const p=ease((t-3.8)/.14);
      const cx=800-500*p;
      const gr=x.createLinearGradient(800,0,cx,0);

      gr.addColorStop(0,'rgba(55,214,230,0)');
      gr.addColorStop(1,'rgba(160,255,255,.9)');

      x.fillStyle=gr;
      x.globalAlpha=1-cl((t-3.94)/.16);
      x.beginPath();
      x.moveTo(800,G-100);
      x.lineTo(cx,G-120);
      x.lineTo(cx,G-60);
      x.lineTo(800,G-90);
      x.fill();
      x.globalAlpha=1;

      for(let i=1;i<4;i++){
        ninja(t,Math.min(800,cx+i*40),st.o,.25/i);
      }
    }

    ninja(t,st.px,st.o,st.al);
  }

  if(t>4.5){
    const dt=t-4.5;

    blood.forEach(p=>{
      const y0=G-105,gy=G+p.r*2.2,
      d=(-p.vy+Math.sqrt(p.vy*p.vy+2*900*(gy-y0)))/900;

      const px=480+p.vx*Math.min(dt,d);
      let py=y0+p.vy*dt+450*dt*dt;

      x.fillStyle='#c1121f';
      x.beginPath();

      if(dt>=d)x.ellipse(px,gy,p.r*1.8,p.r*.6,0,0,7);
      else x.arc(px,py,p.r,0,7);

      x.fill();
    });
  }

  // Falling petals
  petals.forEach(p=>{
    const px=((p[0]*W-t*(30+p[2]*40))%W+W)%W,
    py=(p[1]*H+t*(20+p[3]*30))%H;

    x.save();
    x.globalAlpha=.75;
    x.fillStyle='#ffc2d8';
    x.translate(px,py);
    x.rotate(t+p[2]*6);
    x.beginPath();
    x.ellipse(0,0,5,2.5,0,0,7);
    x.fill();
    x.restore();
  });

  x.restore();

  // Scene dimming
  const d=t<3.5?0:
    t<3.78?ease((t-3.5)/.25)*.55:
    t<4.5?.4:Math.max(0,.4*(1-(t-4.5)/.3));

  if(d>0){
    x.fillStyle='rgba(5,5,25,'+d+')';
    x.fillRect(0,0,W,H);
  }

  // Finishing slashes
  x.save();
  x.translate(sx,sy);
  zm(t);

  if(t>=4.00){
    SL.forEach(s=>{
      const u=cl((t-s[3])/.14);
      const a=t<4.5?1:cl(1-(t-4.5)/.5);

      slash(480,G-100,s[0],s[1],s[2],u,'#fff',a,15);

      if(t>4.5){
        slash(
          480,G-100,s[0],s[1],s[2],1,
          '#d4182c',
          cl((t-4.5)/.1)*(1-cl((t-4.8)/1.6)),
          11
        );
      }
    });
  }

  // Radial strike lines
  if(t>4.5&&t<4.85){
    const k=(t-4.5)/.35;
    x.strokeStyle='rgba(255,255,255,'+(1-k)+')';
    x.lineWidth=2;

    for(let i=0;i<14;i++){
      const an=i/14*6.283+.2,
      r0=60+100*ease(k*2),
      r1=r0+80+240*ease(k);

      x.beginPath();
      x.moveTo(480+Math.cos(an)*r0,G-100+Math.sin(an)*r0);
      x.lineTo(480+Math.cos(an)*r1,G-100+Math.sin(an)*r1);
      x.stroke();
    }
  }

  x.restore();

  // Japanese finishing title
  if(t>4.5&&t<5.3){
    x.save();
    x.globalAlpha=1-(t-4.5)/.8;
    x.font='bold '+(220+30*(t-4.5))+'px serif';
    x.textAlign='center';
    x.lineWidth=6;
    x.strokeStyle='#d4182c';
    x.fillStyle='#fff';
    x.strokeText('斬',700,300);
    x.fillText('斬',700,300);
    x.restore();
  }

  // Flash effects
  const fl=Math.max(
    Math.max(0,1-Math.abs(t-3.78)/.07),
    t>4.5?Math.max(0,1-(t-4.5)/.18):0
  );

  if(fl>0){
    x.fillStyle='rgba(255,255,255,'+fl+')';
    x.fillRect(0,0,W,H);
  }

  // Cinematic vignette
  const v=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);
  v.addColorStop(0,'rgba(5,3,20,0)');
  v.addColorStop(1,'rgba(5,3,20,.55)');
  x.fillStyle=v;
  x.fillRect(0,0,W,H);

  // Cinematic letterbox
  x.fillStyle='#000';
  x.fillRect(0,0,W,34);
  x.fillRect(0,H-34,W,34);

  x.textAlign='center';
  x.fillStyle='#e8f6ff';
  x.font='italic 22px Georgia,serif';

  if(t<2.4){
    x.globalAlpha=Math.min(ease(t/.6),1-ease((t-1.8)/.6));
    x.fillText('Just an ordinary evening...',W/2,H-58);
  }

  // End title
  if(t>6.8){
    const a=ease((t-6.8)/.9);

    x.globalAlpha=a*.55;
    x.fillStyle='#050314';
    x.fillRect(0,0,W,H);

    x.globalAlpha=a;
    x.save();
    x.shadowColor='#37d6e6';
    x.shadowBlur=30;
    x.fillStyle='#fff';
    x.font='bold 64px Georgia,serif';
    x.fillText('SHADOW STRIKE',W/2,H/2-6);
    x.restore();

    x.font='italic 20px Georgia,serif';
    x.fillStyle='#9fefff';
    x.fillText(
      'A new action RPG • Coming soon • Wishlist now',
      W/2,H/2+34
    );
  }

  // Impact cut-in renders last
  impactFrame(t);
  x.globalAlpha=1;
}

/* =========================
   PROCEDURAL SOUND SYSTEM
========================= */
let AC=null,mg=null,NB=null;

function initAudio(){
  if(AC)return;

  AC=new(window.AudioContext||window.webkitAudioContext)();
  mg=AC.createGain();
  mg.gain.value=.8;
  mg.connect(AC.destination);

  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=NB.getChannelData(0);

  for(let i=0;i<d.length;i++){
    d[i]=Math.random()*2-1;
  }
}

function nz(dur,f1,f2,type,vol,w=0){
  if(!AC)return;

  const T=AC.currentTime+w,
  s=AC.createBufferSource(),
  f=AC.createBiquadFilter(),
  g=AC.createGain();

  s.buffer=NB;s.loop=true;
  f.type=type;
  f.frequency.setValueAtTime(f1,T);
  f.frequency.exponentialRampToValueAtTime(f2,T+dur);

  g.gain.setValueAtTime(vol,T);
  g.gain.exponentialRampToValueAtTime(.001,T+dur);

  s.connect(f);f.connect(g);g.connect(mg);
  s.start(T);s.stop(T+dur+.05);
}

function tn(f1,f2,dur,type,vol,w=0){
  if(!AC)return;

  const T=AC.currentTime+w,
  o=AC.createOscillator(),
  g=AC.createGain();

  o.type=type;
  o.frequency.setValueAtTime(f1,T);
  o.frequency.exponentialRampToValueAtTime(f2,T+dur);

  g.gain.setValueAtTime(vol,T);
  g.gain.exponentialRampToValueAtTime(.001,T+dur);

  o.connect(g);g.connect(mg);
  o.start(T);o.stop(T+dur+.05);
}

const thud=()=>nz(.12,400,120,'lowpass',.5);
const pent=[293.7,329.6,370,440,493.9,587.3];

const pluck=f=>{
  tn(f,f*.99,.9,'triangle',.12);
  tn(f*2,f*2,.4,'sine',.03);
};

const EV=[];

[0,.5,1,1.5,2,2.5,3,3.4].forEach((s,i)=>
  EV.push([s,()=>pluck(pent[[0,2,1,3,4,2,3,5][i]])])
);

for(let s=.3;s<3.7;s+=.349){
  EV.push([s,()=>nz(.08,500,200,'lowpass',.35)]);
}

const sw=()=>nz(.15,3000,9000,'highpass',.6);

EV.push(
  [0,()=>nz(6,500,300,'lowpass',.07)],
  [2,()=>nz(.45,3000,300,'bandpass',.5)],
  [2.45,()=>{
    tn(110,35,.5,'sine',.9);
    nz(.3,800,100,'lowpass',.6);
  }],
  [3.05,()=>{
    nz(.5,4000,9000,'highpass',.35);
    tn(2500,6000,.45,'sawtooth',.05);
  }],
  [3.45,()=>tn(2600,2600,.6,'sine',.25)],
  [3.55,()=>tn(70,45,.2,'sine',.8)],
  [3.68,()=>tn(70,45,.2,'sine',.9)],
  [3.78,()=>nz(.25,500,6000,'bandpass',.9)],

  // Impact-frame sound
  [3.86,()=>{
    nz(.10,6500,1200,'highpass',.8);
    tn(120,42,.22,'sine',.85);
    tn(1800,240,.12,'square',.12);
  }],

  [4.00,sw],
  [4.13,sw],
  [4.26,sw],

  [4.5,()=>{
    nz(.5,6000,800,'highpass',.9);
    tn(80,30,.9,'sine',1);
    nz(.5,900,150,'lowpass',.9);
    tn(300,100,.3,'square',.2);
  }],

  [6.55,()=>{
    tn(1800,1200,.08,'square',.2);
    nz(.1,5000,3000,'highpass',.3);
  }],

  [6.9,()=>{
    [146.8,220,293.7,370].forEach(f=>
      tn(f,f,2.5,'sawtooth',.06)
    );
  }]
);

EV.sort((a,b)=>a[0]-b[0]);

/* =========================
   PLAYBACK AND REPLAY
========================= */
let t0=0,fi=0,playing=false;

function start(){
  initAudio();

  if(AC.state==='suspended')AC.resume();

  t0=performance.now();
  fi=0;
  playing=true;
  b.textContent='↻ REPLAY';
}

function loop(n){
  let t=0;

  if(playing){
    t=(n-t0)/1000;

    if(t>13){
      t0=n;t=0;fi=0;
    }

    while(fi<EV.length&&EV[fi][0]<=t){
      if(t-EV[fi][0]<.4)EV[fi][1]();
      fi++;
    }
  }

  frame(t);

  if(!playing){
    x.fillStyle='rgba(0,0,0,.45)';
    x.fillRect(0,0,W,H);
    x.fillStyle='#fff';
    x.font='bold 28px Georgia,serif';
    x.textAlign='center';
    x.fillText('Tap PLAY (sound on)',W/2,H/2);
  }

  requestAnimationFrame(loop);
}

b.onclick=start;
requestAnimationFrame(loop);
